[project]
name = "backend"
version = "0.1.0"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.22.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
    "passlib[argon2]>=1.7.4",
    "email-validator>=2.3.0",
    "python-jose[cryptography]>=3.5.0",
    "argon2-cffi>=25.1.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"